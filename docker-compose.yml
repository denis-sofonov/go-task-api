services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: tasks
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d tasks"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ["/app/migrate", "up"]
    environment:
      DATABASE_URL: postgres://app:app@db:5432/tasks?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    environment:
      APP_ENV: development
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me}
      DATABASE_URL: postgres://app:app@db:5432/tasks?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
